<style data-purpose="scroll-snap-layout">
    /* Essential for the full-screen snapping experience on mobile */
    body, html {
      height: 100%;
      margin: 0;
      overflow: hidden; /* Prevent default scroll */
    }
    .snap-container {
      height: 100vh;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      background-color: #0a0a0a;
    }
    .snap-section {
      height: 100vh;
      width: 100%;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
  </style>
<style data-purpose="visual-effects">
    /* Text stroke and textures for the "Ultimate Tournament" feel */
    .text-outline {
      -webkit-text-stroke: 1px rgba(255, 255, 255, 0.3);
    }
    .text-glow {
      text-shadow: 0 0 15px rgba(249, 125, 28, 0.6);
    }
    .bg-stadium-gradient {
      background: radial-gradient(circle at center, #1a1a1a 0%, #0a0a0a 100%);
    }
    
    /* Animation for the scroll indicator */
    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
      40% {transform: translateY(-10px);}
      60% {transform: translateY(-5px);}
    }
    .animate-bounce-custom {
      animation: bounce 2s infinite;
    }

    /* Transition effects for team images */
    .team-img {
      transition: opacity 0.8s ease-out, transform 0.8s ease-out;
      opacity: 0;
      transform: scale(0.95);
    }
    .snap-section.is-visible .team-img {
      opacity: 1;
      transform: scale(1);
    }

<!-- BEGIN: InteractivityScript -->
<script data-purpose="scroll-animations">
    // Intersection Observer to trigger fade-in animations on scroll
    const observerOptions = {
      root: document.getElementById('main-scroll-container'),
      threshold: 0.5
    };

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
        } else {
          // Optional: remove to keep them visible once revealed
          // entry.target.classList.remove('is-visible'); 
        }
      });
    }, observerOptions);

    document.querySelectorAll('.snap-section').forEach(section => {
      observer.observe(section);
    });
  </script>
<!-- END: InteractivityScript -->
