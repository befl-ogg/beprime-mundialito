<script>
        // Micro-interactions for tab switching (Visual only)
        const tabs = document.querySelectorAll('.notch-sm');
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => {
                    t.classList.remove('bg-primary-container', 'text-on-primary');
                    t.classList.add('bg-surface-container-high', 'text-on-surface-variant', 'border', 'border-outline-variant');
                });
                tab.classList.remove('bg-surface-container-high', 'text-on-surface-variant', 'border', 'border-outline-variant');
                tab.classList.add('bg-primary-container', 'text-on-primary');
            });
        });

        // Simple parallax effect for cards on scroll
        window.addEventListener('scroll', () => {
            const cards = document.querySelectorAll('.notch');
            cards.forEach((card, index) => {
                const speed = (index % 2 === 0) ? 0.05 : 0.02;
                const rect = card.getBoundingClientRect();
                if(rect.top < window.innerHeight && rect.bottom > 0) {
                    const yPos = -(window.scrollY * speed);
                    // Subtle translation for feeling of depth
                    card.style.transform = `translateY(${yPos % 10}px)`;
                }
            });
        });
    </script>
